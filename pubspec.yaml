name: flutter_keychain_fix
description: Flutter secure storage via Keychain (iOS) and Keystore (Android).
version: 0.0.1
homepage: https://github.com/ehangwork/flutter_keychain_fix
repository: https://github.com/ehangwork/flutter_keychain_fix
issue_tracker: https://github.com/ehangwork/flutter_keychain_fix/issues

# SPDX identifier, not just the file. pub.dev reads this first and falls back to
# matching the text of LICENSE, which breaks the moment a paragraph is inserted
# above the terms.
license: BSD-3-Clause

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.ehangwork.flutterkeychainfix
        pluginClass: FlutterKeychainFixPlugin
      ios:
        pluginClass: FlutterKeychainFixPlugin
