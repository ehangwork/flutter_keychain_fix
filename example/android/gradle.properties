org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
kotlin.code.style=official
file.encoding=utf-8
kotlin.jvm.target.validation.mode=ERROR
# These two opt-outs are what Flutter 3.44's own template ships, so they are correct here.
# They mean Kotlin support comes from the Kotlin Gradle Plugin; AGP 9 prints a deprecation
# notice on every build until they are removed, which requires Flutter 3.47 or later.
android.newDsl=false
android.builtInKotlin=false
